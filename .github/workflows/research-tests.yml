name: Buffett Brain — integrity and research tests
on:
  push:
    branches: [main]
    paths: ['cases/**', 'knowledge/**', 'deep-dives/**', 'skills/**', 'scripts/**', 'tests/**', 'plugin.json', 'CHATGPT.md', 'index.html', 'app.js', 'styles.css', '.github/workflows/research-tests.yml']
  pull_request:
    paths: ['cases/**', 'knowledge/**', 'deep-dives/**', 'skills/**', 'scripts/**', 'tests/**', 'plugin.json', 'CHATGPT.md', 'index.html', 'app.js', 'styles.css', '.github/workflows/research-tests.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/validate_knowledge.py
      - run: python3 -m unittest discover -s tests -v
      - run: node --check app.js
      # Upload one release candidate only when deliberately requested.
      - name: Export plugin candidate
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[plugin-release]')
        uses: actions/upload-artifact@v4
        with:
          name: warren-buffett-brain-chatgpt-plugin
          path: dist/warren-buffett-brain-chatgpt-plugin.zip
          if-no-files-found: error
          retention-days: 1
