name: Buffett Brain MCP live smoke test and submission package
on:
  push:
    paths:
      - '.github/workflows/mcp-check-and-package.yml'
      - 'tests/mcp-live-smoke.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test live public MCP protocol
        run: node tests/mcp-live-smoke.mjs
      - name: Build With MCP submission ZIP
        run: python3 scripts/build_chatgpt_plugin.py --mcp-url "https://axmttnzfvzsfhcruhmce.supabase.co/functions/v1/buffett-brain-mcp/mcp"
      - uses: actions/upload-artifact@v4
        with:
          name: warren-buffett-brain-with-mcp-verified
          path: dist/warren-buffett-brain-with-mcp.zip
          if-no-files-found: error
          retention-days: 2
